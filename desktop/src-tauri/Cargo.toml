[package]
name = "agent-vis-desktop"
version = "0.1.0"
description = "Secure desktop session explorer for Claude Code and Codex"
authors = ["agent-vis contributors"]
edition = "2021"

[lib]
name = "agent_vis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
