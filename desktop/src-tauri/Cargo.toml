[package]
name = "agent-vis-desktop"
version = "0.1.0"
description = "Secure desktop session explorer for Claude Code and Codex"
authors = ["agent-vis contributors"]
edition = "2021"

[lib]
name = "agent_vis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
curve25519-dalek = "4.1.3"
dirs = "6"
libc = "0.2"
reqwest = { version = "0.13.4", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
safetensors = "0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
snow = "0.10.0"
tauri = { version = "2", features = [] }
tokenizers = { version = "0.23.1", default-features = false, features = ["fancy-regex"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
